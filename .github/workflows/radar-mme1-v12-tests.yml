name: RadarMME1 V1.2 LAB - Autotestes
on:
  push:
    branches:
      - lab/radar-mme1-v12
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check radar-mme1/robot.js
      - run: node radar-mme1/test_robot.js
      - run: node radar-mme1/test_v12.js
      - run: node radar-mme1/audit-v12.js data/radar-mme1-state.json
