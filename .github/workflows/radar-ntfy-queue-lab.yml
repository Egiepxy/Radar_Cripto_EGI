name: RadarMME1 LAB - teste da fila ntfy sem envio
on:
  push:
    branches: ['lab/radar-ntfy-fila-v11']
    paths: ['radar-mme1/queue-policy.js','radar-mme1/test_queue_policy.js','radar-mme1/robot.js','.github/workflows/radar-ntfy-queue-lab.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check radar-mme1/robot.js
      - run: node radar-mme1/test_robot.js
      - run: node radar-mme1/test_queue_policy.js
