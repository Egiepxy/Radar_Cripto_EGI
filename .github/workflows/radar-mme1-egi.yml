name: Robo RadarMME1 EGI LAB
on:
  schedule:
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-mme1-egi
  cancel-in-progress: false

jobs:
  avaliar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Testar regras sem rede
        run: node radar-mme1/test_robot.js
      - name: Coletar Binance, avaliar setup e enviar ntfy
        env:
          NTFY_ENABLED: "true"
          NTFY_TOPIC: RadarMME1_11
        run: node radar-mme1/robot.js
      - name: Persistir snapshot e auditoria
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radar-mme1-latest.json data/radar-mme1-state.json data/radar-mme1-history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(radar-mme1): atualizar analise e auditoria"
            git push
          else
            echo "Sem mudanças"
          fi
