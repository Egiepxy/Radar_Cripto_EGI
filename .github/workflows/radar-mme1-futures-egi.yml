name: Robo RadarMME1 EGI Multimercados LAB
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-mme1-futures-egi
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4
      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Testar regras de sinais e auditoria sem rede
        run: |
          node radar-mme1/test_robot.js
          node radar-mme1/test_futures.js
      - name: Coletar Binance Futures USD-M e avaliar sinais
        env:
          NTFY_ENABLED: "true"
          NTFY_TOPIC: RadarMME1_11
        run: node radar-mme1/futures-robot.js
      - name: Salvar snapshot, historico e diagnostico
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radar-mme1-futures-latest.json data/radar-mme1-futures-state.json data/radar-mme1-futures-history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(radar-mme1): atualizar coleta Futures LAB"
            if ! git push; then
              git pull --rebase
              git push
            fi
          else
            echo "Nenhum dado alterado nesta coleta"
          fi
